name: Scrape menus

on:
  schedule:
    # 5:17am and 3:17pm Pacific (13:17 and 23:17 UTC during standard time)
    - cron: "17 13 * * *"
    - cron: "17 23 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scraper.run --days 3
      - name: Commit updated menus
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update menus $(date -u +%F)"
          git push
