<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What should I eat? · Berkeley Dining</title>
<meta name="description" content="The best Berkeley dining hall for your goal right now, with live ratings.">
<meta name="theme-color" content="#14325c">

<!--
  This file is only the page's skeleton and its looks (CSS).
  The logic lives in the js/ folder:
    js/config.js    settings
    js/app.js       loads menus, draws the page, handles taps   <- start here
    js/scoring.js   ratings and goal maths
    js/backend.js   where votes are stored
-->

<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #1a1c21;
    --muted: #6a6f79;
    --line: #e4e0d6;
    --accent: #14325c;
    --on-accent: #ffffff;
    --on-accent-muted: #c5d3e8;
    --gold: #f0b429;
    --gold-ink: #6b4a00;
    --gold-bg: #fdf3d8;
    --open: #17804a;
    --open-bg: #e3f4ea;
    --soon: #9a6400;
    --soon-bg: #fbefd7;
    --closed: #7d838c;
    --closed-bg: #eceef1;
    --chip: #eef1f6;
    --chip-ink: #3c4350;
    --veg: #2f7a3e;
    --veg-bg: #e6f3e7;
    --down: #b3402e;
    --down-bg: #fbe9e6;
    --hero-kicker: #f0b429;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --card: #191c22;
      --ink: #eceef2;
      --muted: #9aa1ad;
      --line: #2a2e36;
      --accent: #9cc2ff;
      --on-accent: #0d1524;
      --on-accent-muted: #2c4468;
      --gold: #f2c14e;
      --gold-ink: #f7d784;
      --gold-bg: #3a3017;
      --open: #4fd08a;
      --open-bg: #14321f;
      --soon: #f0b860;
      --soon-bg: #3a2c12;
      --closed: #8b929c;
      --closed-bg: #23272e;
      --chip: #232833;
      --chip-ink: #c9cfda;
      --veg: #7fd38c;
      --veg-bg: #163020;
      --down: #ff9b8a;
      --down-bg: #3a1c17;
      --hero-kicker: #5c3f00;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  button { font: inherit; }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 0 10px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  h1 span { color: var(--gold); }
  .clock { color: var(--muted); font-size: 13px; white-space: nowrap; }

  .pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .pills::-webkit-scrollbar { display: none; }
  #periods { padding-bottom: 12px; }
  .pill {
    flex: 0 0 auto;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .banner {
    margin: 12px 0 0; padding: 10px 12px; border-radius: 10px;
    background: var(--chip); color: var(--chip-ink); font-size: 14px;
  }

  /* ---------- Goal picker ---------- */
  .goal-label { margin: 16px 0 8px; font-size: 13px; font-weight: 700; color: var(--muted);
                letter-spacing: 0.04em; text-transform: uppercase; }

  /* ---------- Recommendation card ---------- */
  .hero {
    margin-top: 14px; padding: 16px; border-radius: 16px;
    background: var(--accent); color: var(--on-accent);
  }
  .hero-kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
                 color: var(--hero-kicker); }
  .hero-hall { margin: 2px 0 0; font-size: 26px; letter-spacing: -0.02em; }
  .hero-why { font-size: 14px; opacity: 0.85; margin: 2px 0 10px; }
  .picks { list-style: none; margin: 0; padding: 0; counter-reset: pick; }
  .picks li {
    counter-increment: pick; position: relative;
    padding: 9px 0 9px 30px; border-top: 1px solid var(--on-accent-muted);
  }
  .picks li::before {
    content: counter(pick); position: absolute; left: 0; top: 10px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--gold); color: #3b2a00; font-size: 12px; font-weight: 700;
    display: grid; place-items: center;
  }
  .pick-name { display: block; font-weight: 600; }
  .pick-meta { display: block; font-size: 13px; opacity: 0.85; }

  /* ---------- Hall cards ---------- */
  main { padding: 14px 0 32px; display: grid; gap: 14px; }
  .hall { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 6px; }
  .hall.is-closed { opacity: 0.72; }
  .hall-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hall-name { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  .hours { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .rating-line { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  .score { color: var(--ink); font-weight: 700; font-size: 15px; }
  .live { color: var(--open); font-weight: 700; }

  .status { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .status.open { color: var(--open); background: var(--open-bg); }
  .status.soon { color: var(--soon); background: var(--soon-bg); }
  .status.closed, .status.none { color: var(--closed); background: var(--closed-bg); }
  .status.open::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                         background: currentColor; margin-right: 6px; vertical-align: 1px; }

  .dishes { list-style: none; margin: 0; padding: 0; }
  .dish { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .dish-info { flex: 1; min-width: 0; }
  .station { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .dish-name { font-weight: 600; margin: 1px 0 2px; }
  .meta { font-size: 13px; color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--chip-ink); }
  .chip.protein { background: var(--gold-bg); color: var(--gold-ink); }
  .chip.veg { background: var(--veg-bg); color: var(--veg); }
  .allergens { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ---------- Thumbs up / down ---------- */
  .vote { flex: 0 0 auto; text-align: center; padding-top: 12px; }
  .vote-btns { display: flex; gap: 6px; }
  .vote-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card);
    font-size: 17px; line-height: 1; cursor: pointer;
    filter: grayscale(1); opacity: 0.7;
  }
  .vote-btn[aria-pressed="true"] { filter: none; opacity: 1; }
  .vote-btn.up[aria-pressed="true"] { background: var(--open-bg); border-color: var(--open); }
  .vote-btn.down[aria-pressed="true"] { background: var(--down-bg); border-color: var(--down); }
  .vote-pct { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  details { border-top: 1px solid var(--line); }
  summary { cursor: pointer; list-style: none; padding: 11px 0; font-size: 14px; font-weight: 600; color: var(--accent); }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: " ▾"; }
  details[open] > summary::after { content: " ▴"; }
  details .dishes .dish:first-child { border-top: 0; }

  .empty { color: var(--muted); font-size: 14px; padding: 4px 0 12px; }
  footer { color: var(--muted); font-size: 12px; padding: 0 0 40px; }
  footer p { margin: 6px 0; }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="top">
        <h1>What should I eat<span>?</span></h1>
        <div class="clock" id="clock"></div>
      </div>
      <nav class="pills" id="periods" aria-label="Choose a meal"></nav>
    </div>
  </header>

  <div class="wrap">
    <div id="banner"></div>

    <div class="goal-label" id="goal-label">I want to</div>
    <div class="pills" id="goals" role="group" aria-labelledby="goal-label"></div>

    <div id="hero"></div>
    <main id="halls"><p class="empty">Loading today's menus…</p></main>
    <footer id="footer"></footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
