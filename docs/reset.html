<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · Campus Menus</title>
<meta name="theme-color" content="#14325c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Campus Menus">
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #1a1c21;
    --muted: #6a6f79;
    --line: #e4e0d6;
    --accent: #14325c;
    --on-accent: #ffffff;
    --gold: #f0b429;
    --chip: #eef1f6;
    --down: #b3402e;
    --open: #17804a;
    --shadow: 0 12px 40px rgba(20, 50, 92, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --card: #191c22;
      --ink: #eceef2;
      --muted: #9aa1ad;
      --line: #2a2e36;
      --accent: #9cc2ff;
      --on-accent: #0d1524;
      --gold: #f2c14e;
      --chip: #232833;
      --down: #ff9b8a;
      --open: #4fd08a;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  button { font: inherit; cursor: pointer; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(ellipse 120% 80% at 50% -20%, color-mix(in srgb, var(--gold) 22%, transparent), transparent 55%),
      var(--bg);
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px 24px;
    box-shadow: var(--shadow);
  }
  .brand-kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 26px;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  h1 span { color: var(--gold); }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 22px; line-height: 1.4; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--ink); }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }
  input:focus {
    outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
    border-color: var(--accent);
  }
  .primary {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 16px;
    font-weight: 700;
  }
  .err { color: var(--down); font-size: 14px; margin: 10px 0 0; min-height: 1.2em; }
  .ok { color: var(--open); font-size: 14px; margin: 10px 0 0; min-height: 1.2em; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 16px; line-height: 1.45; text-align: center; }
  .text-link {
    border: 0; background: none; padding: 0; color: var(--accent);
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <p class="brand-kicker">Your campus dining companion</p>
    <h1>Campus <span>Menus</span></h1>
    <p class="sub" id="sub">Choose a new password for your account.</p>
    <form id="form" autocomplete="on">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="password2">Confirm password</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="8" required>
      <p class="err" id="err" aria-live="polite"></p>
      <p class="ok" id="ok" aria-live="polite"></p>
      <button type="submit" class="primary" id="submit">Update password</button>
    </form>
    <p class="hint" id="hint"><a class="text-link" href="login.html">Back to sign in</a></p>
  </div>
  <script type="module" src="js/pwa.js"></script>
  <script type="module" src="js/reset.js"></script>
</body>
</html>
